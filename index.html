<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SA.EZHIL - Coding Learning</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Landing Page Section -->
  <section id="landing-page" class="page active">
    <div class="glass-card main-card">
      <h1 class="brand-title">SA.EZHIL</h1>
      <p class="subtitle">CODING LEARNING PAGE</p>
      <button id="get-started-btn" class="glass-btn">GET STARTED</button>
    </div>
  </section>

  <!-- Languages Section -->
  <section id="languages-page" class="page">
    <div class="glass-card dashboard-card">
      <h2>SELECT A LANGUAGE</h2>
      
      <div class="language-grid">
       <!-- HTML Button -->

<button class="lang-btn" onclick="window.location.href='index(HTML).html'">
    <span class="emoji">🌐</span>
    <div class="btn-text">
        <h3>HTML</h3>
        <p>Structure</p>
    </div>
</button>

        <!-- CSS Button -->
        <button class="lang-btn" onclick="window.location.href='INDEX(CSS).HTML'">
          <span class="emoji">🎨</span>
          <div class="btn-text">
            <h3>CSS</h3>
            <p>Styling</p>
          </div>
        </button>

        <!-- JavaScript Button -->
        <button class="lang-btn" onclick="window.location.href='index(js).html'">
          <span class="emoji">⚡</span>
          <div class="btn-text">
            <h3>JAVASCRIPT</h3>
            <p>Logic & Interactivity</p>
          </div>
        </button>

        <!-- C++ Button -->
        <button class="lang-btn" onclick="window.location.href='index(C++).html'">
          <span class="emoji">⚙️</span>
          <div class="btn-text">
            <h3>C++</h3>
            <p>Performance & Systems</p>
          </div>
        </button>
      </div>

      <button id="back-btn" class="glass-btn back-btn">← BACK</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
